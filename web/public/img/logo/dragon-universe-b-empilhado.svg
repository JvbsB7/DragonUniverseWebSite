<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 40" role="img" aria-labelledby="duB-s-title">
  <title id="duB-s-title">Dragon Universe — direção B, composição empilhada</title>
  <defs>
    <linearGradient id="duB-s-face" x1="0" y1="0" x2="0" y2="12" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1674ff"/>
      <stop offset=".45" stop-color="#2d86eb"/>
      <stop offset="1" stop-color="#3fbbfe"/>
    </linearGradient>
    <linearGradient id="duB-s-depth" x1="0" y1="0" x2="0" y2="12" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22358a"/>
      <stop offset="1" stop-color="#122344"/>
    </linearGradient>
    <filter id="duB-s-ki" x="-10%" y="-20%" width="120%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation=".7"/>
    </filter>

    <path id="duB-s-D" fill-rule="evenodd" d="M0 0H6V1H7V2H8V10H7V11H6V12H0ZM2 2V10H5V9H6V3H5V2Z"/>
    <path id="duB-s-R" fill-rule="evenodd" d="M0 0H6V1H8V6H6V8H7V10H8V12H5V10H4V8H2V12H0ZM2 2V5H6V2Z"/>
    <path id="duB-s-A" fill-rule="evenodd" d="M2 0H6V1H7V3H8V12H6V8H2V12H0V3H1V1H2ZM2 3V6H6V3H5V2H3V3Z"/>
    <path id="duB-s-G" d="M1 0H8V2H2V10H6V7H4V5H8V12H1V11H0V1H1Z"/>
    <path id="duB-s-O" fill-rule="evenodd" d="M1 0H7V1H8V11H7V12H1V11H0V1H1ZM2 2V10H6V2Z"/>
    <path id="duB-s-N" d="M0 0H4V4H5V6H6V0H8V12H5V8H4V6H3V4H2V12H0Z"/>
    <path id="duB-s-U" d="M0 0H2V9H3V10H5V9H6V0H8V10H7V11H6V12H2V11H1V10H0Z"/>
    <path id="duB-s-I" d="M1 0H7V2H5V10H7V12H1V10H3V2H1Z"/>
    <path id="duB-s-V" d="M0 0H2V4H3V7H4V9H5V7H6V4V0H8V5H7V8H6V10H5V12H3V10H2V8H1V5H0Z"/>
    <path id="duB-s-E" d="M0 0H8V2H2V5H7V7H2V10H8V12H0Z"/>
    <path id="duB-s-S" d="M1 0H8V2H2V5H7V6H8V11H7V12H0V10H6V7H1V6H0V1H1Z"/>

    <g id="duB-s-dragon">
      <use href="#duB-s-D"/>
      <use href="#duB-s-R" x="10"/>
      <use href="#duB-s-A" x="20"/>
      <use href="#duB-s-G" x="30"/>
      <use href="#duB-s-O" x="40"/>
      <use href="#duB-s-N" x="50"/>
    </g>
    <g id="duB-s-universe">
      <use href="#duB-s-U"/>
      <use href="#duB-s-N" x="10"/>
      <use href="#duB-s-I" x="20"/>
      <use href="#duB-s-V" x="30"/>
      <use href="#duB-s-E" x="40"/>
      <use href="#duB-s-R" x="50"/>
      <use href="#duB-s-S" x="60"/>
      <use href="#duB-s-E" x="70"/>
    </g>
    <g id="duB-s-words">
      <use href="#duB-s-dragon" transform="translate(14 4) matrix(1 0 .12 1 0 0)"/>
      <use href="#duB-s-universe" transform="translate(4 23) matrix(1 0 .12 1 0 0)"/>
    </g>
  </defs>

  <use href="#duB-s-words" fill="#23d7ff" stroke="#23d7ff" stroke-width="1" opacity=".20" filter="url(#duB-s-ki)"/>

  <g fill="url(#duB-s-depth)" stroke="#060a16" stroke-width="1.1" stroke-linejoin="miter" paint-order="stroke fill">
    <use href="#duB-s-words" transform="translate(2 2)"/>
    <use href="#duB-s-words" transform="translate(1.5 1.5)"/>
    <use href="#duB-s-words" transform="translate(1 1)"/>
    <use href="#duB-s-words" transform="translate(.5 .5)"/>
  </g>
  <use href="#duB-s-words" fill="url(#duB-s-face)" stroke="#060a16" stroke-width="1.1" stroke-linejoin="miter" paint-order="stroke fill"/>
  <use href="#duB-s-words" fill="none" stroke="#aaecff" stroke-width=".18" stroke-linejoin="miter" opacity=".85"/>

  <path fill="#060a16" d="M31 18H49L47 19H62L53 23H35L37 22H22Z"/>
  <path fill="#f6b943" d="M32 19H47L44 20H58L52 22H37L40 21H26Z"/>
</svg>
